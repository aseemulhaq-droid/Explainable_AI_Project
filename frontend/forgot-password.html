<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Pulse XAI password using a one-time verification code sent to your email.">
  <title>Reset Password — Pulse XAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card">

      <!-- Header -->
      <div class="auth-header">
        <h1>Reset <span class="text-cyan">Password</span></h1>
        <p>Recover access to your account</p>
      </div>

      <!-- Step Indicators -->
      <div class="wizard-steps">
        <div class="step-indicator active" id="wizForgotStep1">
          <div class="step-number">1</div>
          <span>Enter Email</span>
        </div>
        <div class="step-indicator" id="wizForgotStep2">
          <div class="step-number">2</div>
          <span>Reset Password</span>
        </div>
      </div>

      <!-- Alerts -->
      <div id="errorAlert"   class="alert alert-error   hidden" role="alert"></div>
      <div id="successAlert" class="alert alert-success hidden" role="status"></div>

      <!-- ── STEP 1: Request OTP ── -->
      <div id="forgotStep1">
        <form id="forgotFormStep1" novalidate>
          <div class="form-group">
            <label class="form-label" for="forgotEmail">Email Address</label>
            <div class="input-with-icon">
              <span class="icon">✉️</span>
              <input type="email" id="forgotEmail" class="form-control" required
                     autocomplete="email" placeholder="name@hospital.com">
            </div>
          </div>

          <button type="submit" id="forgotStep1Btn" class="btn btn-primary">
            Send Reset Code
          </button>
        </form>
      </div>

      <!-- ── STEP 2: Verify & Reset ── -->
      <div id="forgotStep2" class="hidden">
        <div class="otp-intro">
          <p>Enter the 6-digit code sent to your email, then choose a new password.</p>
          <p class="otp-hint">In development mode, check <code>history/latest_otp.json</code>.</p>
        </div>

        <form id="forgotFormStep2" novalidate>
          <div class="form-group">
            <label class="form-label" for="forgotOtp">6-Digit Reset Code</label>
            <input type="text" id="forgotOtp" class="form-control otp-input" required
                   inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                   title="6-digit code" placeholder="000000" autofocus>
          </div>

          <div class="form-group">
            <label class="form-label" for="newPassword">New Password</label>
            <div class="input-with-icon">
              <span class="icon">🔒</span>
              <input type="password" id="newPassword" class="form-control" required
                     autocomplete="new-password" minlength="8"
                     placeholder="Min. 8 characters">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmNewPassword">Confirm New Password</label>
            <div class="input-with-icon">
              <span class="icon">🔒</span>
              <input type="password" id="confirmNewPassword" class="form-control" required
                     autocomplete="new-password" minlength="8"
                     placeholder="Repeat new password">
            </div>
          </div>

          <button type="submit" id="forgotStep2Btn" class="btn btn-primary">
            Reset Password
          </button>

          <div class="auth-link-row auth-link-row-center" style="margin-top:16px;">
            <a href="#" id="resendResetLink">Resend code</a>
            <span class="link-separator">·</span>
            <a href="#" id="backToForgotStep1">← Use a different email</a>
          </div>
        </form>
      </div>

      <div class="auth-footer">
        Remembered it? <a href="login.html">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script>
    // Back to step 1
    document.getElementById('backToForgotStep1')?.addEventListener('click', (e) => {
      e.preventDefault();
      sessionStorage.removeItem('forgot_email');
      document.getElementById('forgotStep2').classList.add('hidden');
      document.getElementById('forgotStep1').classList.remove('hidden');
      document.getElementById('wizForgotStep1').classList.add('active');
      document.getElementById('wizForgotStep2').classList.remove('active');
      clearAuthAlerts();
    });
  </script>
  <script src="js/auth.js"></script>
</body>
</html>
